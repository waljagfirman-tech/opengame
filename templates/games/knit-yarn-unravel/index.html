<script>
(function(){
  var chunks={"cocos2d-js-min.js":["cocos2d-js-min.part0.js","cocos2d-js-min.part1.js"]};
  function findChunk(u){
    if(typeof u!=='string') return null;
    var clean=u.split('?')[0].split('#')[0];
    for(var key in chunks){
      if(clean===key||clean==='./'+key||clean.endsWith('/'+key)) return key;
    }
    return null;
  }
  var origAppend=Node.prototype.appendChild;
  Node.prototype.appendChild=function(el){
    var parent=this;
    if(el&&el.tagName==='SCRIPT'&&el.getAttribute){
      var src=el.getAttribute('src')||el.src||'';
      var key=findChunk(src);
      if(key){
        var clean=src.split('?')[0].split('#')[0];
        var base=clean.slice(0,clean.lastIndexOf('/')+1);
        el.removeAttribute('src');
        Promise.all(chunks[key].map(function(p){
          return fetch(base+p).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();});
        })).then(function(parts){
          el.textContent=parts.join('');
          origAppend.call(parent,el);
          if(typeof el.onload==='function') el.onload(new Event('load'));
          el.dispatchEvent(new Event('load'));
        }).catch(function(err){
          if(typeof el.onerror==='function') el.onerror(err);
          el.dispatchEvent(new Event('error'));
        });
        return el;
      }
    }
    return origAppend.call(this,el);
  };
})();
</script>

          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
