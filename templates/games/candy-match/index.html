<script>

  function matchKey(u){
    if(!u) return null;
    var s=String(u).split('?')[0].split('#')[0];
    for(var k in MAP){
      if(s===k||s==='./'+k||s.endsWith('/'+k)) return k;
    }
    return null;
  }
  function partBase(u,k){
    var s=String(u).split('?')[0].split('#')[0];
    var idx=s.lastIndexOf(k);
    return idx>=0?s.slice(0,idx):'';
  }
  function loadBuf(u,k){
    var pre=partBase(u,k);
    var parts=MAP[k];
    var dir=k.includes('/')?k.slice(0,k.lastIndexOf('/')+1):'';
    return Promise.all(parts.map(function(p){
      return origFetch(pre+dir+p).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer();});
    })).then(function(bufs){
      var total=0; for(var i=0;i<bufs.length;i++) total+=bufs[i].byteLength;
      var out=new Uint8Array(total), off=0;
      for(var j=0;j<bufs.length;j++){out.set(new Uint8Array(bufs[j]),off);off+=bufs[j].byteLength;}
      return out.buffer;
    });

  var origFetch=window.fetch.bind(window);
  window.fetch=function(input,init){
    var u=typeof input==='string'?input:(input&&input.url)||'';
    var k=matchKey(u);

    return loadBuf(u,k).then(function(buf){
      var ct=k.endsWith('.json')?'application/json':k.endsWith('.svg')?'image/svg+xml':k.endsWith('.mp3')?'audio/mpeg':k.endsWith('.wav')?'audio/wav':'application/octet-stream';
      return new Response(buf,{status:200,headers:{'Content-Type':ct}});

  };
  var X=window.XMLHttpRequest, origOpen=X.prototype.open, origSend=X.prototype.send;
  X.prototype.open=function(m,u){this.__ckUrl=u;this.__ckKey=matchKey(u);return origOpen.apply(this,arguments);};

    loadBuf(self.__ckUrl,self.__ckKey).then(function(buf){
      var rt=self.responseType||'', val=buf;
      if(rt===''||rt==='text'){val=new TextDecoder('utf-8').decode(buf);}
      else if(rt==='json'){val=JSON.parse(new TextDecoder('utf-8').decode(buf));}
      else if(rt==='blob'){val=new Blob([buf]);}
      Object.defineProperty(self,'readyState',{configurable:true,value:4});
      Object.defineProperty(self,'status',{configurable:true,value:200});
      Object.defineProperty(self,'response',{configurable:true,value:val});
      if(rt===''||rt==='text'){Object.defineProperty(self,'responseText',{configurable:true,value:val});}
      if(typeof self.onprogress==='function') self.onprogress({lengthComputable:true,loaded:buf.byteLength,total:buf.byteLength});
      self.dispatchEvent(new Event('readystatechange'));

  var origHeadAppend=HTMLHeadElement.prototype.appendChild;

      for(var fk in MAP){
        if((fk.endsWith('.ttf')||fk.endsWith('.otf')||fk.endsWith('.woff2'))&&txt.indexOf(fk)>=0){

          loadBuf(fk,fk).then(function(buf){
            if(typeof FontFace!=='undefined'){
              var ff=new FontFace(fam,buf);
              return ff.load().then(function(loaded){document.fonts.add(loaded);});
            }
          }).catch(function(){});
          break;
        }
      }
    }
    return origHeadAppend.call(this,el);
  };
})();
