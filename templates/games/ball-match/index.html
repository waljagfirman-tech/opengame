<!-- Polyfills bundle. -->

<script>
(function(){
  function mem(){var s=Object.create(null);return{get length(){return Object.keys(s).length;},key:function(i){return Object.keys(s)[i]||null;},getItem:function(k){k=String(k);return Object.prototype.hasOwnProperty.call(s,k)?s[k]:null;},setItem:function(k,v){s[String(k)]=String(v);},removeItem:function(k){delete s[String(k)];},clear:function(){for(var k in s)delete s[k];}};}
  ['localStorage','sessionStorage'].forEach(function(n){try{void window[n];}catch(e){try{Object.defineProperty(window,n,{value:mem(),configurable:true});}catch(_){}}});
})();
</script>
<script src="src/polyfills.bundle.js" charset="utf-8"> </script>


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
(function(){
  var chunks={"cocos-js/cc.js":["cc.part0.js","cc.part1.js","cc.part2.js"]};
  var proto=Object.getPrototypeOf(System),orig=proto.instantiate;
  proto.instantiate=function(url,parent){
    for(var key in chunks){
      if(url.endsWith('/'+key)){
        var base=url.slice(0,url.lastIndexOf('/')+1);
        return Promise.all(chunks[key].map(function(p){
          return fetch(base+p).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();});
        })).then(function(parts){
          var reg=null,prev=System.register;
          System.register=function(d,f){reg=[d,f];};
          try{(0,eval)(parts.join(''));}finally{System.register=prev;}
          return reg;
        });
      }
    }
    return orig.call(this,url,parent);
  };
})();
</script>
<script>
    System.import('./index.js').catch(function(err) { console.error(err); })
</script>
